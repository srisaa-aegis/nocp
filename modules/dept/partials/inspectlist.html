<h2>Inspection Dashboard</h2>
<div class="panel panel-primary">
	<div class="panel-heading">
		<h3 class="panel-title">Pending Applications</h3>
	</div>
	<div class="panel-body" ng-controller="applicationController">
		<!-- Applications table -->
		<table class="table table-striped table-hover">
			<thead>
				<tr>
					<th>Appl.No</th>
					<th>District</th>
					<th>Name of Building</th>
					<th>Address</th>
					<th>Type</th>
					<th>Status</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr ng-repeat="application in applications">
					<td>{{ application.appl_number }}</td>
					<td>Krishna</td>
					<td>{{application.site_name}}</td>
					<td>{{application.site_addr}}</td>
					<td>{{type_name(application.site_type)}}</td>
					<td>{{status_description(application.status)}}</td>
					<td>
						<button class="btn btn-xs btn-success" ng-click="InspectReport(application.appl_id)">
							<i class="glyphicon glyphicon-edit"></i> Update
						</button>
					</td>
				</tr>

			</tbody>
		</table>
	</div>
</div>
