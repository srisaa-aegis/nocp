<form class="field" (ngSubmit)="submit()">
  @if (message(); as m) {
    <p [class]="m.kind === 'success' ? 'msg msg--success' : 'msg msg--error'">{{ m.text }}</p>
  }
  <label class="field__label" for="email">Registered Email</label>
  <input id="email" class="input" type="email" name="email" [ngModel]="email()" (ngModelChange)="email.set($event)" />
  <button type="submit" class="btn btn--primary btn--block" style="margin-top: 16px">Send Reset Instructions</button>
  <a style="display:block;text-align:center;margin-top:16px;font-size: var(--font-size-sm)" routerLink="/auth/login"
    >&larr; Back to Sign In</a
  >
</form>
