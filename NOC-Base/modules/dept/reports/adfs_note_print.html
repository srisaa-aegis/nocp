<div class="form-group row">
    <label class="col-sm-8 col-form-label"><h4>1) Relavant applicable rules in the NBC guidelines</h4></label>
    <div class="col-sm-4">
        <label class="form-control"><dt>{{form_to.adfs_nbc_rules}}</dt></label>
    </div>
</div>
<div class="form-group row">
    <label class="col-sm-12 col-form-label"><h4>2) Cross Checking of the finding of the inspection committee, RFO's observations and NBC guidelines or any other Rules</h4></label>
</div>
<div class="form-group row">
    <label class="col-sm-8 col-form-label">Is there any difference of opinion between the inspection committee report and RFO's Finding?</label>
    <div class="col-sm-4">
        <label class="form-control"><dt>{{form_to.adfs_diff_opi}}</dt></label>
    </div>
</div>
<div class="form-group row" ng-if="form_to.adfs_diff_opi == 1">
    <label class="col-sm-8 col-form-label">If there is any difference of opinion, what the ACT/NBC guidelines say? and what is your view?</label>
    <div class="col-sm-4">
        <label class="form-control"><dt>{{form_to.adfs_what_diff}}</dt></label>
    </div>
</div>
<div class="form-group row">
    <label class="col-sm-8 col-form-label">Is the recommdation of the committee as per the norms?</label>
    <div class="col-sm-4">
        <label class="form-control"><dt>{{form_to.adfs_comm_norm}}</dt></label>
    </div>
</div>
<div class="form-group row">
    <label class="col-sm-8 col-form-label"><h4>3) Any deficiencies you have noticed in the entire proposal of the applicant, in implementation, and in the Committee's Report? If Yes, Please Explain.</h4></label>
    <div class="col-sm-4">
        <label class="form-control"><dt>{{form_to.adfs_deficits}}</dt></label>
    </div>
</div>
<div class="form-group row">
    <label class="col-sm-8 col-form-label"><h4>4) Please Specify your clear opinion with reasons?</h4></label>
    <div class="col-sm-4">
        <label class="form-control"><dt>{{form_to.remark}}</dt></label>
    </div>
</div>
